<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASGISTICS | Join the Fleet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .tech-font { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); }
        input, select { 
            background: rgba(255,255,255,0.05) !important; 
            border: 1px solid rgba(255,255,255,0.1) !important; 
            color: white !important; 
            transition: all 0.3s ease;
        }
        input:focus, select:focus { border-color: #06b6d4 !important; outline: none; background: rgba(255,255,255,0.1) !important; }
    </style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen relative overflow-hidden">
    
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>

    <div class="mb-12 text-center relative z-10">
        <h1 class="text-4xl font-black tracking-tighter uppercase italic text-white tech-font">MASGISTICS</h1>
        <p class="text-[10px] tracking-[0.5em] text-cyan-400 uppercase font-bold mt-2">Personnel Onboarding Portal</p>
    </div>

    <div class="glass-card p-10 w-full max-w-lg border-t-4 border-t-cyan-500 relative z-10 shadow-2xl">
        <h2 class="text-xl font-bold mb-8 uppercase tracking-widest text-center italic text-white">Join the Orbital Network</h2>
        
        <form action="/initiate-onboarding" method="post" class="space-y-6">
            <!-- Full Name -->
            <div>
                <label class="text-[10px] uppercase text-white/40 font-bold tracking-widest">Identification (ชื่อ-นามสกุล)</label>
                <input type="text" name="name" placeholder="Pilot Name" class="w-full p-4 mt-2 rounded-none outline-none" required>
            </div>

            <!-- Phone -->
            <div>
                <label class="text-[10px] uppercase text-white/40 font-bold tracking-widest">Communication (เบอร์โทรศัพท์)</label>
                <input type="tel" name="phone" placeholder="08X-XXX-XXXX" class="w-full p-4 mt-2 rounded-none outline-none" required>
            </div>

            <!-- User Role (จุดที่ต้องแก้ไข!) -->
            <div>
                <label class="text-[10px] uppercase text-white/40 font-bold tracking-widest">Sector Role (ประเภทผู้ใช้งาน)</label>
                <select name="user_role" class="w-full p-4 mt-2 rounded-none font-bold text-sm cursor-pointer" required>
                    <option value="" disabled selected>-- SELECT YOUR ROLE --</option>
                    <option value="shipper">เจ้าของวัสดุ (Material Owner)</option>
                    <option value="fleet">เจ้าของกลุ่มรถ (Fleet Owner)</option>
                    <option value="individual">เจ้าของรถรายย่อย (Individual Carrier)</option>
                    <option value="agency">นายหน้า/ตัวแทน (Logistics Agency)</option>
                </select>
            </div>

            <!-- Province -->
            <div>
                <label class="text-[10px] uppercase text-white/40 font-bold tracking-widest">Deployment Zone (จังหวัด)</label>
                <input type="text" name="province" placeholder="เช่น กรุงเทพฯ, ชลบุรี" class="w-full p-4 mt-2 rounded-none outline-none" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-white text-black py-5 mt-6 text-xs font-black uppercase tracking-[0.4em] hover:bg-cyan-400 hover:text-white transition-all duration-500 shadow-lg shadow-white/5">
                Initiate Onboarding
            </button>
        </form>
    </div>

    <p class="mt-12 text-[9px] text-white/20 uppercase tracking-[1em] font-bold relative z-10">MASHUB Systems Architecture</p>

</body>
</html>
